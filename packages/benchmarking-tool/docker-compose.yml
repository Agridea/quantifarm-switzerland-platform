services:
    db:
        container_name: quantifarm-postgresql
        image: postgresql-amanos
        build: './build/postgresql'
        restart: "no"
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ../databases/benchmarking-tool:/var/lib/postgresql/data
        ports:
            - 5555:5432
    api:
        container_name: quantifarm-benchmarking-tool
        image: fastapi-amanos
        build: './build/fastapi'
        restart: "no"
        depends_on:
            db: 
                condition: service_started
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./volume/fastapi-app/app:/app
        ports:
            - "8686:8686"