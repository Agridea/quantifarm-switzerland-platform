# Security hardening: deny access to sensitive files served from the bind-mounted docroot.
# This file lives in /etc/apache2/conf-enabled and is NOT overridden by the
# ./:/var/www/html volume mount in docker-compose.yml.

# Deny all dotfiles (.env, .git*, .dockerignore, ...)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Deny infrastructure and database files
<FilesMatch "(?i)\.(sql|ya?ml|ini|conf|log|sh|bak|swp)$">
    Require all denied
</FilesMatch>

<FilesMatch "(?i)^(dockerfile|docker-compose.*|readme\.md|license)$">
    Require all denied
</FilesMatch>

# Deny dot-directories such as .git if present in the mount
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

# Disable directory listings
<Directory /var/www/html>
    Options -Indexes
</Directory>
