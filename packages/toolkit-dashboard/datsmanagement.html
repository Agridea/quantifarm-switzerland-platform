<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>QuantiFarm - DAT Management</title>

    <link href="assets/img/QuantiFarm-element-60x60.png" rel="icon" sizes="32x32">
    <link href="assets/img/QuantiFarm-element-60x60.png" rel="apple-touch-icon">

    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <link href="assets/vendor/bootstrap/css/bootstrap.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
    <link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">

    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/digiagrifood-theme.css" rel="stylesheet">
</head>

<body>

    <!-- ======= Header ======= -->
    <header id="header" class="header fixed-top d-flex align-items-center notranslate">
        <div class="d-flex align-items-center justify-content-start">
            <a href="index.html" class="logo d-flex align-items-center">
                <span>Toolkit</span>
            </a>
            <i class="bi bi-list toggle-sidebar-btn"></i>
        </div>

        <nav class="header-nav ms-auto h-100">
            <ul class="d-flex align-items-center h-100">
                <li class="nav-item dropdown pt-3 h-100 d-flex align-items-center">
                    <a class="nav-link text-primary dropdown-toggle pb-3" href="#" id="lngDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">DE</a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="lngDropdown">
                        <li><a class="dropdown-item" href="#" onclick="setLanguage('DE');return false;">DE - Deutsch</a></li>
                        <li><a class="dropdown-item" href="#" onclick="setLanguage('FR');return false;">FR - Français</a></li>
                        <li><a class="dropdown-item" href="#" onclick="setLanguage('IT');return false;">IT - Italiano</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown pe-2 pt-3 h-100" id="mnuLogin">
                    <a class="nav-link d-flex align-items-center text-primary px-4" href="login.html?url=datsmanagement.html">
                        <i class="ri-login-box-line" style="font-size: 26px"></i>
                        <span>Login</span>
                    </a>
                </li>
                <li class="nav-item pe-2 h-100 d-flex align-items-center" id="mnuUser" hidden>
                    <a class="nav-link d-flex align-items-center text-primary px-4" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-gear" style="font-size: 26px"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
                        <li class="dropdown-header"><h6 id="mnuUserName"></h6></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item d-flex align-items-center" href="profile.html"><i class="bi bi-person"></i><span>My Profile</span></a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item d-flex align-items-center" href="php/api.php?c=out"><i class="bi bi-box-arrow-right"></i><span>Log out</span></a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header><!-- End Header -->

    <!-- ======= Sidebar ======= -->
    <aside id="sidebar" class="sidebar">
        <ul class="sidebar-nav" id="sidebar-nav"></ul>
    </aside><!-- End Sidebar-->

    <main id="main" class="main">

        <div class="pagetitle d-flex justify-content-between">
            <h1>DAT Management</h1>
        </div>

        <div id="divNotAdmin" class="alert alert-danger" hidden>
            This page is only available to registered administrators.
        </div>

        <section class="section" id="divAdmin" hidden>

            <div class="row mb-3">
                <div class="col-sm-6">
                    <select class="form-select" id="cboDat" onchange="LoadDat()">
                        <option value="">-- Create new DAT --</option>
                    </select>
                </div>
                <div class="col-sm-6 text-end">
                    <button type="button" class="btn btn-secondary" id="btnNew" onclick="NewDat()">New</button>
                    <button type="button" class="btn btn-danger" id="btnDelete" onclick="DeleteDat()" disabled>Delete</button>
                </div>
            </div>

            <div class="alert alert-danger" id="divErr" hidden></div>
            <div class="alert alert-success" id="divOk" hidden></div>

            <ul class="nav nav-tabs" id="tabsDat" role="tablist">
                <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabEdit" type="button">Edit</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabHistory" type="button" onclick="LoadHistory()">Change History</button></li>
            </ul>

            <div class="tab-content pt-3">
                <div class="tab-pane fade show active" id="tabEdit">
                    <form id="formDat" class="row g-2">
                        <input type="hidden" id="datUri">
                        <input type="hidden" id="datLastModified">

                        <div class="col-md-6">
                            <label class="form-label">Name (unique) <i class="bi bi-asterisk ms-1"></i></label>
                            <input type="text" class="form-control" id="fName" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Input language</label>
                            <select class="form-select" id="fSourceLanguage" onchange="SourceLanguageChanged()">
                                <option value="en" selected>English</option>
                                <option value="de">Deutsch</option>
                                <option value="fr">Français</option>
                                <option value="it">Italiano</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Translation status</label>
                            <input type="text" class="form-control" id="fTranslationStatus" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="fTitle">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Website</label>
                            <input type="url" class="form-control" id="fWebsite" placeholder="https://...">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="fDescription" rows="3"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Keywords (comma-separated)</label>
                            <input type="text" class="form-control" id="fKeywords">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Agricultural sector(s) (comma-separated)</label>
                            <input type="hidden" id="fSector">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fSectorSelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fSectorOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Functionality (comma-separated)</label>
                            <input type="hidden" id="fFunctionality">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fFunctionalitySelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fFunctionalityOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Benefits (comma-separated)</label>
                            <input type="hidden" id="fBenefits">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fBenefitsSelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fBenefitsOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Delivery form (comma-separated)</label>
                            <input type="hidden" id="fDelivery">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fDeliverySelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fDeliveryOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Supported languages (comma-separated)</label>
                            <input type="hidden" id="fLanguages">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fLanguagesSelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fLanguagesOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Cost structure</label>
                            <input type="hidden" id="fCost">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fCostSelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fCostOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Country (comma-separated)</label>
                            <input type="hidden" id="fCountry">
                            <div class="dropdown" data-bs-auto-close="outside">
                                <input type="text" class="form-select qf-cursor-def" id="fCountrySelect"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" onkeydown="return false;"
                                    style="caret-color: transparent !important;" autocomplete="off">
                                <ul class="dropdown-menu qf-max-h-300" id="fCountryOptions"
                                    style="min-width: 100%;"></ul>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Launch year</label>
                            <input type="number" class="form-control" id="fLaunchYear" min="1980" max="9999" step="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Last update year</label>
                            <input type="number" class="form-control" id="fLastUpdateYear" min="1980" max="9999" step="1">
                        </div>

                        <div class="col-12 mt-3">
                            <button type="button" class="btn btn-primary" id="btnSave" onclick="SaveDat()">Save</button>
                        </div>
                    </form>
                </div>

                <div class="tab-pane fade" id="tabHistory">
                    <table class="table table-sm">
                        <thead><tr><th>When</th><th>User</th><th>Action</th></tr></thead>
                        <tbody id="tblHistory"></tbody>
                    </table>
                </div>
            </div>

        </section>

    </main><!-- End #main -->

    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="js/uistrings.js"></script>
    <script src="js/app.js"></script>
    <script src="js/datsmanagement.js"></script>
</body>

</html>
