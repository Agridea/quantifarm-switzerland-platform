<body>

    <main>
        <div class="container">

            <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-start pt-5">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

                            <div class="d-flex justify-content-center py-4">
                                <a href="index.html" class="logo d-flex align-items-center w-auto">
                                    <span class="d-none d-lg-block">Toolkit</span>
                                </a>
                            </div><!-- End Logo -->

                            <div class="card mb-3">

                                <div class="card-body">

                                    <div class="pt-2 pb-2">
                                        <h5 class="card-title text-center pb-0 fs-4" id="loginCardTitle">Login to Your Account</h5>
                                        <p class="text-center small" id="loginCardSubtitle">Enter your email &amp; password to login</p>
                                    </div>

                                    <form id="formMain" class="row g-3 needs-validation" novalidate onsubmit="return false;">

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" name="email" class="form-control" id="yourEmail" placeholder="Email" required>
                                                <label for="yourEmail" id="loginEmailLabel">Email</label>
                                                <div class="invalid-feedback" id="loginEmailInvalid">Please enter a valid Email address!</div>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="password" name="password" class="form-control" id="yourPassword" placeholder="Password" required>
                                                <label for="yourPassword" id="loginPasswordLabel">Password</label>
                                                <div class="invalid-feedback" id="loginPasswordInvalid">Please enter your password!</div>
                                            </div>
                                        </div>

                                        <div class="col-12 text-end">
                                            <button class="btn btn-primary" type="submit" id="btnSubmit" onclick="Login()">Login</button>
                                            <a class="btn btn-secondary" href="index.html" id="loginBtnBack">Back</a>
                                        </div>
                                        <div class="col-12" id="divErr">
                                        </div>
                                        <div class="col-12">
                                            <p class="small mb-0"><span id="loginNoAccount">Don't have account? </span><a href="register.html" id="loginCreateAccount">Create an account</a></p>
                                            <p class="small mb-0"><a href="forgotten.html" id="loginForgottenPwd">Forgotten password</a></p>
                                        </div>
                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </section>

        </div>
    </main><!-- End #main -->

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <!-- Hidden language tab infrastructure -->
    <div hidden>
        <ul class="nav nav-pills" id="lngTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lngBtnEN" data-bs-toggle="tab" data-bs-target="#lngTabEN" type="button" role="tab" aria-controls="lngTabEN" aria-selected="false" tabindex="-1" title="EN" onclick="LoadLanguageContent('EN', ApplyLoginTranslations)"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="lngBtnDE" data-bs-toggle="tab" data-bs-target="#lngTabDE" type="button" role="tab" aria-controls="lngTabDE" aria-selected="true" title="DE" onclick="LoadLanguageContent('DE', ApplyLoginTranslations)"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lngBtnFR" data-bs-toggle="tab" data-bs-target="#lngTabFR" type="button" role="tab" aria-controls="lngTabFR" aria-selected="false" tabindex="-1" title="FR" onclick="LoadLanguageContent('FR', ApplyLoginTranslations)"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lngBtnIT" data-bs-toggle="tab" data-bs-target="#lngTabIT" type="button" role="tab" aria-controls="lngTabIT" aria-selected="false" tabindex="-1" title="IT" onclick="LoadLanguageContent('IT', ApplyLoginTranslations)"></button>
            </li>
        </ul>
        <div class="tab-content" id="lngTabsContent">
            <div class="tab-pane fade" id="lngTabEN" role="tabpanel" aria-labelledby="lngBtnEN"></div>
            <div class="tab-pane fade" id="lngTabFR" role="tabpanel" aria-labelledby="lngBtnFR"></div>
            <div class="tab-pane fade" id="lngTabIT" role="tabpanel" aria-labelledby="lngBtnIT"></div>
            <div class="tab-pane fade active show" id="lngTabDE" role="tabpanel" aria-labelledby="lngBtnDE"></div>
        </div>
    </div>

    <!-- Vendor JS Files -->
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Template Main JS File -->
    <script src="assets/js/main.js"></script>
    <script src="js/uistrings.js"></script>
    <script src="js/app.js"></script>
    <script src="js/usr.js"></script>

    <script>
        function ApplyLoginTranslations(lng) {
            const tab = document.getElementById('lngTab' + lng);
            const val = (key) => {
                const el = tab ? tab.querySelector('[data-login-key="' + key + '"]') : null;
                return el ? el.textContent.trim() : null;
            };
            const setTxt = (id, txt) => { if (txt) { const el = document.getElementById(id); if (el) el.textContent = txt; } };
            const setAttr = (id, attr, txt) => { if (txt) { const el = document.getElementById(id); if (el) el.setAttribute(attr, txt); } };

            setTxt('loginCardTitle', val('card-title'));
            setTxt('loginCardSubtitle', val('card-subtitle'));
            setTxt('loginEmailLabel', val('email-label'));
            setAttr('yourEmail', 'placeholder', val('email-label'));
            setTxt('loginEmailInvalid', val('email-invalid'));
            setTxt('loginPasswordLabel', val('pwd-label'));
            setAttr('yourPassword', 'placeholder', val('pwd-label'));
            setTxt('loginPasswordInvalid', val('pwd-invalid')); 
            setTxt('btnSubmit', val('btn-Submit'));
            setTxt('loginBtnBack', val('btn-back'));
            setTxt('loginNoAccount', val('no-account'));
            setTxt('loginCreateAccount', val('create-account'));
            setTxt('loginForgottenPwd', val('forgotten-pwd'));
        }
    </script>

</body>
