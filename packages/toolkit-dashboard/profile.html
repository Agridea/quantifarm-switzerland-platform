<body>

    <main>
        <div class="container">

            <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-start pt-5">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

                            <div class="d-flex justify-content-center py-4">
                                <a href="index.html" class="logo d-flex align-items-center w-auto">
                                    <span class="d-none d-lg-block">Toolkit</span>
                                </a>
                            </div><!-- End Logo -->

                            <div class="card mb-3">

                                <div class="card-body">

                                    <div class="pt-2 pb-2">
                                        <h5 class="card-title text-center pb-0 fs-4" id="profCardTitle">My Profile</h5>
                                    </div>

                                    <form id="formMain" class="row g-2 needs-validation" novalidate onsubmit="return false;">

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" name="name" class="form-control" id="yourName" placeholder="Your Name" required>
                                                <label for="yourName" id="profNameLabel">Your Name</label>
                                                <div class="invalid-feedback" id="profNameInvalid">Please enter your name!</div>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" name="email" class="form-control bg-light" id="yourEmail" placeholder="Your Email (unchangeable)" readonly>
                                                <label for="yourEmail" id="profEmailLabel">Your Email (unchangeable)</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="dropdown">
                                                <div class="form-floating">
                                                    <input type="text" class="form-select qf-cursor-def" name="roles" id="yourRoles" data-bs-toggle="dropdown" aria-expanded="false" onkeydown="return false;" style="caret-color: transparent !important;" autocomplete="off">
                                                    <label for="yourRoles" id="profRolesLabel">Roles</label>
                                                    <ul class="dropdown-menu qf-max-h-300" style="min-width: 100%;" qf-multiselect>
                                                        <li><label class="dropdown-item"><input type="checkbox" class="me-2 qf-scale-14" value="Farmer"><span data-prof-role="farmer">Farmer</span></label></li>
                                                        <li><label class="dropdown-item"><input type="checkbox" class="me-2 qf-scale-14" value="Advisor"><span data-prof-role="advisor">Advisor</span></label></li>
                                                        <li><label class="dropdown-item"><input type="checkbox" class="me-2 qf-scale-14" value="Policy related"><span data-prof-role="policy">Policy related</span></label></li>
                                                        <li><label class="dropdown-item"><input type="checkbox" class="me-2 qf-scale-14" value="Researcher"><span data-prof-role="researcher">Researcher</span></label></li>
                                                        <li><label class="dropdown-item"><input type="checkbox" class="me-2 qf-scale-14" value="Agritech"><span data-prof-role="agritech">Agritech</span></label></li>
                                                        <li><label class="dropdown-item"><input type="checkbox" class="me-2 qf-scale-14" value="Other"><span data-prof-role="other">Other</span></label></li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <select class="form-select" name="age" id="yourAge" aria-label="Age">
                                                    <option></option>
                                                    <option>up to 29</option>
                                                    <option>30-39</option>
                                                    <option>40-49</option>
                                                    <option>50-59</option>
                                                    <option>60+</option>
                                                </select>
                                                <label for="yourAge" id="profAgeLabel">Age</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <select class="form-select" name="gender" id="yourGender" aria-label="Gender">
                                                    <option></option>
                                                    <option data-prof-gender="male">Male</option>
                                                    <option data-prof-gender="female">Female</option>
                                                    <option data-prof-gender="other">Other</option>
                                                </select>
                                                <label for="yourGender" id="profGenderLabel">Gender</label>
                                            </div>
                                        </div>

                                        <div class="col-12" hidden>
                                            <div class="form-floating">
                                                <select class="form-select" name="country" id="yourCountry" aria-label="Country">
                                                    <option value="Switzerland" selected>Switzerland</option>
                                                </select>
                                                <label for="yourCountry">Country</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="text-primary mt-1" data-bs-toggle="collapse" href="#collapsePsw" aria-expanded="false" role="button" aria-controls="collapsePsw">
                                                <i class="bi bi-caret-down-fill me-1"></i><span id="profChangePwd">Change password</span>
                                            </div>
                                            <div class="mb-2 mt-1 collapse" id="collapsePsw">
                                                <div class="col-12 mb-1">
                                                    <div class="form-floating">
                                                        <input type="password" name="password1" class="form-control" id="oldPassword" placeholder="Old Password">
                                                        <label for="oldPassword" id="profOldPwdLabel">Old Password</label>
                                                    </div>
                                                </div>
                                                <div class="col-12">
                                                    <div class="form-floating">
                                                        <input type="password" name="password2" class="form-control" id="newPassword" placeholder="New Password">
                                                        <label for="newPassword" id="profNewPwdLabel">New Password</label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="text-primary mt-1" data-bs-toggle="collapse" href="#collapseDel" aria-expanded="false" role="button" aria-controls="collapseDel">
                                                <i class="bi bi-caret-down-fill me-1"></i><span id="profDeleteAccount">Delete account</span>
                                            </div>
                                            <div class="mb-4 mt-1 collapse" id="collapseDel">
                                                <div class="row text-center align-items-center">
                                                    <div class="col-6">
                                                        <div class="form-floating">
                                                            <input type="password" name="password3" class="form-control" id="delPassword" placeholder="Password">
                                                            <label for="delPassword" id="profDelPwdLabel">Password</label>
                                                        </div>
                                                    </div>
                                                    <div class="col-6">
                                                        <button class="btn btn-warning" type="submit" id="btnDel" onclick="Delete()"><span id="profBtnDelete">Delete account</span></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-12 text-end">
                                            <button class="btn btn-primary" type="submit" id="btnSubmit" onclick="ProfileSave()"><span id="profBtnUpdate">Update Profile</span></button>
                                            <a class="btn btn-secondary" href="index.html" id="profBtnBack">Back</a>
                                        </div>
                                        <div class="col-12" id="divErr">
                                        </div>
                                    </form>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </section>

        </div>
    </main><!-- End #main -->

    <!-- Hidden language tab infrastructure -->
    <div hidden>
        <ul class="nav nav-pills" id="lngTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lngBtnEN" data-bs-toggle="tab" data-bs-target="#lngTabEN" type="button" role="tab" aria-controls="lngTabEN" aria-selected="false" tabindex="-1" title="EN" onclick="LoadLanguageContent('EN', ApplyProfileTranslations)"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="lngBtnDE" data-bs-toggle="tab" data-bs-target="#lngTabDE" type="button" role="tab" aria-controls="lngTabDE" aria-selected="true" title="DE" onclick="LoadLanguageContent('DE', ApplyProfileTranslations)"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lngBtnFR" data-bs-toggle="tab" data-bs-target="#lngTabFR" type="button" role="tab" aria-controls="lngTabFR" aria-selected="false" tabindex="-1" title="FR" onclick="LoadLanguageContent('FR', ApplyProfileTranslations)"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lngBtnIT" data-bs-toggle="tab" data-bs-target="#lngTabIT" type="button" role="tab" aria-controls="lngTabIT" aria-selected="false" tabindex="-1" title="IT" onclick="LoadLanguageContent('IT', ApplyProfileTranslations)"></button>
            </li>
        </ul>
        <div class="tab-content" id="lngTabsContent">
            <div class="tab-pane fade" id="lngTabEN" role="tabpanel" aria-labelledby="lngBtnEN"></div>
            <div class="tab-pane fade" id="lngTabFR" role="tabpanel" aria-labelledby="lngBtnFR"></div>
            <div class="tab-pane fade" id="lngTabIT" role="tabpanel" aria-labelledby="lngBtnIT"></div>
            <div class="tab-pane fade active show" id="lngTabDE" role="tabpanel" aria-labelledby="lngBtnDE"></div>
        </div>
    </div>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <!-- Vendor JS Files -->
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/tinymce/tinymce.min.js"></script>

    <!-- Template Main JS File -->
    <script src="assets/js/main.js"></script>
    <script src="js/uistrings.js"></script>
    <script src="js/app.js"></script>
    <script src="js/usr.js"></script>

    <script>
        function ApplyProfileTranslations(lng) {
            const tab = document.getElementById('lngTab' + lng);
            const val = (key) => {
                const el = tab ? tab.querySelector('[data-prof-key="' + key + '"]') : null;
                return el ? el.textContent : null;
            };
            const setTxt = (id, txt) => { if (txt !== null) { const el = document.getElementById(id); if (el) el.textContent = txt; } };
            const setAttr = (id, attr, txt) => { if (txt !== null) { const el = document.getElementById(id); if (el) el.setAttribute(attr, txt); } };

            setTxt('profCardTitle', val('card-title'));

            const nameLabel = val('name-label');
            setTxt('profNameLabel', nameLabel);
            setAttr('yourName', 'placeholder', nameLabel);
            setTxt('profNameInvalid', val('name-invalid'));

            const emailLabel = val('email-label');
            setTxt('profEmailLabel', emailLabel);
            setAttr('yourEmail', 'placeholder', emailLabel);

            setTxt('profRolesLabel', val('roles-label'));
            ['farmer', 'advisor', 'policy', 'researcher', 'agritech', 'other'].forEach(r => {
                const txt = val('role-' + r);
                if (txt !== null) {
                    const el = document.querySelector('[data-prof-role="' + r + '"]');
                    if (el) el.textContent = txt;
                }
            });
            refreshMultiselectDisplay('yourRoles');

            setTxt('profAgeLabel', val('age-label'));

            setTxt('profGenderLabel', val('gender-label'));
            ['male', 'female', 'other'].forEach(g => {
                const txt = val('gender-' + g);
                if (txt !== null) {
                    const el = document.querySelector('#yourGender option[data-prof-gender="' + g + '"]');
                    if (el) el.textContent = txt;
                }
            });

            setTxt('profChangePwd', val('change-pwd'));
            const oldPwdLabel = val('old-pwd-label');
            setTxt('profOldPwdLabel', oldPwdLabel);
            setAttr('oldPassword', 'placeholder', oldPwdLabel);
            const newPwdLabel = val('new-pwd-label');
            setTxt('profNewPwdLabel', newPwdLabel);
            setAttr('newPassword', 'placeholder', newPwdLabel);

            setTxt('profDeleteAccount', val('delete-account'));
            const delPwdLabel = val('del-pwd-label');
            setTxt('profDelPwdLabel', delPwdLabel);
            setAttr('delPassword', 'placeholder', delPwdLabel);
            setTxt('profBtnDelete', val('btn-delete'));

            setTxt('profBtnUpdate', val('btn-update'));
            setTxt('profBtnBack', val('btn-back'));

            // Re-apply gender and age so the display uses translated labels
            const user = JSON.parse(localStorage.getItem(key_usr));
            if (user) {
                if (user.gender) setUIValue('yourGender', user.gender);
                if (user.age) setUIValue('yourAge', user.age);
            }
        }

        // Rebuilds multiselect display using current (translated) label texts
        // while keeping the English item.value in qfSelectedValuesAsArray for DB submission.
        function refreshMultiselectDisplay(ctrlId) {
            const el = document.getElementById(ctrlId);
            if (!el || !el.qfSelectedValuesAsArray) return;
            const saved = [...el.qfSelectedValuesAsArray];
            if (saved.length === 0) return;
            el.qfSelectedItemsAsArray = [];
            el.qfSelectedValuesAsArray = [];
            el.value = '';
            const chk = Array.from(el.closest('.dropdown').querySelectorAll('ul input[type=checkbox]'));
            chk.forEach(c => {
                if (saved.includes(c.value)) {
                    c.checked = false;
                    c.checked = true;
                    c.dispatchEvent(new Event('change', { bubbles: true }));
                } else {
                    c.checked = false;
                }
            });
        }

        // Saves English key values (item.value) to DB, not the translated display text.
        function ProfileSave() {
            const el = document.getElementById('yourRoles');
            if (el && el.qfSelectedValuesAsArray)
                el.value = el.qfSelectedValuesAsArray.join(sep_MultiSelect);
            Profile();
        }
    </script>
